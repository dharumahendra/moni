gem "github-pages", group: :jekyll_plugins
title: MONI
description: MONI adalah web app sinking fund proaktif yang menarik data kurs via API untuk diolah Machine Learning. Sistem menyesuaikan target tabungan harian dan merekomendasikan pemotongan biaya non-esensial saat kurs melemah. Demi privasi, pencatatan memakai unggahan CSV tanpa integrasi API bank.
